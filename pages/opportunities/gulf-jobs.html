<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gulf Jobs - UAE Job Seekers</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="../../assets/css/variables.css" rel="stylesheet">
  <link href="../../assets/css/main.css" rel="stylesheet">
  <link href="../../assets/css/components.css" rel="stylesheet">
</head>
<body data-base="../../">

  <div id="navbar"></div>

  <main class="section-padding">
    <div class="container">

      <!-- START: Top line -->
      <div class="content-bar"></div>
      <!-- END: Top line -->

      <div class="row g-4">

        <!-- START: Filters (offcanvas on mobile, sidebar on desktop) -->
        <aside class="col-lg-3 align-self-start">
          <button class="btn btn-olive d-lg-none w-100 mb-3" type="button"
                  data-bs-toggle="offcanvas" data-bs-target="#filterPanel">
            <i class="bi bi-funnel me-1"></i> Filter Jobs
          </button>

          <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="filterPanel">
            <div class="offcanvas-header">
              <h5 class="offcanvas-title">Filter Jobs</h5>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                      data-bs-target="#filterPanel" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">

              <form id="filterForm" class="filter-card w-100" novalidate>
                <h2 class="filter-title d-none d-lg-flex"><i class="bi bi-funnel-fill"></i> Filter Jobs</h2>
                <p class="filter-hint">Use the filters below and click search to view the results.</p>

                <p class="form-label fw-semibold mb-2">Select Location(s)</p>
                <div id="countryList" class="loc-box mb-4"></div>

                <label class="form-label fw-semibold" for="fKeyword">Job Title</label>
                <input type="text" id="fKeyword" class="form-control mb-3" placeholder="Enter a keyword">

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-olive px-4">Search</button>
                  <button type="button" id="fReset" class="btn btn-olive-outline px-4">Clear</button>
                </div>
              </form>

            </div>
          </div>
        </aside>
        <!-- END: Filters -->

        <!-- START: Jobs List (Center Column) -->
        <div class="col-lg-6">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="list-heading mb-0"><i class="bi bi-briefcase-fill"></i> Open Vacancies</h1>
          </div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <p class="text-muted-uaejs small mb-0" id="jobCount">Loading jobs...</p>
            <select id="fSort" class="form-select form-select-sm w-auto" aria-label="Sort jobs">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="title">Title A-Z</option>
            </select>
          </div>

          <div id="activeChips" class="d-flex flex-wrap gap-2 mb-3"></div>
          <div id="jobsList" class="d-grid gap-3"></div>

          <!-- START: Previous / Page / Next -->
          <div class="pager-simple" id="pager"></div>
          <!-- END: Previous / Page / Next -->
        </div>
        <!-- END: Jobs List -->

        <!-- START: Discover More Sidebar (Right Column) -->
        <aside class="col-lg-3 align-self-start">
          <div class="discover-card">
            <div class="discover-header">Discover more</div>
            <ul class="discover-list list-unstyled mb-0">
              <li><a href="#"><span>Learn Engineering</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="#"><span>Engineer</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="#"><span>ENGINEER</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="#"><span>Benchmark Pay</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="gulf-jobs.html"><span>Search Jobs</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="#"><span>Know Worker Rights</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="#"><span>Learn Arabic</span><i class="bi bi-chevron-right"></i></a></li>
              <li><a href="#"><span>Read Travel Guide</span><i class="bi bi-chevron-right"></i></a></li>
            </ul>
          </div>
        </aside>
        <!-- END: Discover More Sidebar -->

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/include-partials.js"></script>
  <script src="../../assets/js/jobs.js"></script>
</body>
</html>
